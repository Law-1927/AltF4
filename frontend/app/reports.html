<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTF4 - Reports & Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-screen p-3 py-4">

    <main class="w-full max-w-6xl mx-auto bg-black border-2 border-zinc-800 rounded-lg overflow-hidden">
        <header class="bg-zinc-800 border-b border-zinc-700 px-4 py-3 flex justify-between items-center text-xs font-bold uppercase text-zinc-300">
            <span>Staff Reports & Cloud Records</span>
            <span class="flex gap-4">
                <a href="dashboard.html" class="hover:text-white">Dashboard</a>
                <a href="home.html" class="hover:text-white">Home</a>
                <button id="signout" type="button" class="hover:text-white uppercase">Sign out</button>
            </span>
        </header>

        <div class="p-4">
            <p id="msg" role="alert" class="hidden text-xs p-3 mb-4 border"></p>

            <!-- Filters Section -->
            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-lg mb-6">
                <div class="flex flex-wrap items-end justify-between gap-4">
                    <div class="flex flex-wrap items-end gap-3 text-xs">
                        <div>
                            <label for="date-from" class="block text-[10px] uppercase text-zinc-400 mb-1">From Date</label>
                            <input id="date-from" type="date" class="bg-black border border-zinc-700 p-2 text-xs text-white">
                        </div>
                        <div>
                            <label for="date-to" class="block text-[10px] uppercase text-zinc-400 mb-1">To Date</label>
                            <input id="date-to" type="date" class="bg-black border border-zinc-700 p-2 text-xs text-white">
                        </div>
                        <div>
                            <label for="filter-status" class="block text-[10px] uppercase text-zinc-400 mb-1">Status</label>
                            <select id="filter-status" class="bg-black border border-zinc-700 p-2 text-xs text-white">
                                <option value="">All Statuses</option>
                                <option value="Completed">Completed</option>
                                <option value="Ongoing">Ongoing</option>
                                <option value="Pending">Pending</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div>
                            <label for="filter-service" class="block text-[10px] uppercase text-zinc-400 mb-1">Service</label>
                            <select id="filter-service" class="bg-black border border-zinc-700 p-2 text-xs text-white">
                                <option value="">All Services</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="btn-filter" type="button" class="bg-zinc-800 border border-zinc-700 text-white text-xs px-3 py-2 font-bold uppercase hover:border-altRed">Apply</button>
                        <button id="btn-export-csv" type="button" class="bg-altRed text-white text-xs px-4 py-2 font-bold uppercase hover:bg-red-700 transition-colors">Export CSV</button>
                    </div>
                </div>

                <!-- Quick Presets -->
                <div class="flex items-center gap-2 mt-3 pt-3 border-t border-zinc-800 text-[11px] text-zinc-400">
                    <span class="text-zinc-500 uppercase text-[10px]">Presets:</span>
                    <button id="preset-today" type="button" class="hover:text-white underline">Today</button>
                    <span>·</span>
                    <button id="preset-week" type="button" class="hover:text-white underline">Last 7 Days</button>
                    <span>·</span>
                    <button id="preset-month" type="button" class="hover:text-white underline">This Month</button>
                    <span>·</span>
                    <button id="preset-all" type="button" class="hover:text-white underline">All Time</button>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4 text-center">
                <div class="bg-zinc-900 border border-zinc-800 p-3">
                    <p class="text-[10px] uppercase text-zinc-500">Revenue (Completed)</p>
                    <p id="st-revenue" class="text-xl font-mono font-bold text-altRed">₱ 0</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 p-3">
                    <p class="text-[10px] uppercase text-zinc-500">Completed Jobs</p>
                    <p id="st-completed" class="text-xl font-mono font-bold">0</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 p-3">
                    <p class="text-[10px] uppercase text-zinc-500">Active Bookings</p>
                    <p id="st-active" class="text-xl font-mono font-bold">0</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 p-3">
                    <p class="text-[10px] uppercase text-zinc-500">Total Filtered</p>
                    <p id="st-total" class="text-xl font-mono font-bold">0</p>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto border border-zinc-900 rounded">
                <table class="w-full text-left text-xs border-collapse min-w-[640px]">
                    <thead class="bg-zinc-900">
                        <tr class="border-b border-zinc-800 text-zinc-400 uppercase text-[11px]">
                            <th class="p-3">Date & Time</th>
                            <th class="p-3">Ref ID</th>
                            <th class="p-3">Client</th>
                            <th class="p-3">Vehicle</th>
                            <th class="p-3">Service</th>
                            <th class="p-3 text-right">Total Due</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <p id="empty" class="hidden text-xs text-zinc-500 text-center py-8">No records matching the selected filters.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/shop-config.js"></script>
    <script src="js/slots.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
