<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTF4 - Home</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="js/color-mode.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="page-wide page-home min-h-screen p-3 py-4">

    <main class="w-full max-w-none bg-black border-2 border-zinc-800 rounded-lg p-4">
        <section class="portal-intro">
            <h1 class="text-2xl font-black italic">ALT<span class="text-altRed">F4</span></h1>
            <p class="mt-2 text-xs text-zinc-500">SHIMMER &amp; SHIELD CAR COATING</p>
            <h2 class="mt-8 text-2xl font-black">Your account, all in one place.</h2>
            <p class="mt-4 text-zinc-400">Manage your profile, vehicle appointments, and service updates from your client portal.</p>
        </section>

        <section class="portal-content" aria-label="Account overview">
            <p id="status" class="text-sm text-zinc-400">Loading your account…</p>

            <div id="account" class="portal-account hidden text-sm">
                <div class="portal-details">
                    <p>Signed in as <strong id="who"></strong></p>
                    <p class="text-zinc-400">Email: <span id="email"></span></p>
                    <p class="text-zinc-400">Role: <span id="role" class="text-altRed font-bold uppercase"></span></p>
                </div>
                <nav class="portal-actions" aria-label="Account actions">
                    <a id="book-link" href="book-service.html" hidden class="block text-center w-full bg-altRed text-white font-bold py-3 text-sm uppercase">Book an appointment</a>
                    <a id="history-link" href="history.html" hidden class="block text-center w-full border border-zinc-700 text-zinc-300 font-bold py-3 text-sm uppercase hover:text-white hover:border-zinc-500">My Bookings &amp; Notices</a>
                    <a id="dash-link" href="dashboard.html" hidden class="block text-center w-full bg-altRed text-white font-bold py-3 text-sm uppercase">Open staff dashboard</a>
                    <a id="reports-link" href="reports.html" hidden class="block text-center w-full border border-zinc-700 text-zinc-300 font-bold py-3 text-sm uppercase hover:text-white hover:border-zinc-500">Staff Reports &amp; Export</a>
                    <button id="signout" type="button" class="w-full border border-zinc-700 text-zinc-300 text-sm font-bold py-3 uppercase hover:text-white hover:border-zinc-500">Sign out</button>
                </nav>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
            integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
