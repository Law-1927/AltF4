<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTF4 - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-sm bg-black border-2 border-zinc-800 rounded-lg p-6">
        <h1 class="text-2xl font-black italic text-center mb-6">ALT<span class="text-altRed">F4</span></h1>

        <p id="status" class="text-sm text-zinc-400 text-center">Loading…</p>

        <div id="account" class="hidden space-y-2 text-sm">
            <p>Signed in as <strong id="who"></strong></p>
            <p class="text-zinc-400">Email: <span id="email"></span></p>
            <p class="text-zinc-400">Role: <span id="role" class="text-altRed font-bold uppercase"></span></p>
            <p id="next" class="text-xs text-zinc-500 pt-2">Booking and dashboard screens come next.</p>
            <button id="signout" type="button" class="w-full border border-zinc-700 text-zinc-300 text-xs font-bold py-2 mt-4 uppercase hover:text-white hover:border-zinc-500">Sign out</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
