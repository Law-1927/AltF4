<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTF4 - Service & Details</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="js/color-mode.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-screen p-3 py-4">

    <main class="w-full max-w-md mx-auto bg-black border-2 border-zinc-800 rounded-lg overflow-hidden">
        <header class="bg-zinc-900 border-b border-zinc-800 px-4 py-3 flex justify-between items-center text-xs font-bold uppercase text-zinc-400">
            <span>1. Service &amp; Details</span>
            <a href="home.html" class="hover:text-white">Back</a>
        </header>

        <div class="p-4">
            <p id="msg" role="alert" class="hidden text-xs p-3 mb-4 border"></p>

            <h2 class="font-bold text-sm uppercase border-l-2 border-altRed pl-2 mb-4">Vehicle Specs</h2>
            <div class="space-y-3 mb-5">
                <input id="f-name" type="text" readonly aria-label="Your name"
                       class="w-full bg-zinc-900 border border-zinc-700 p-2 text-xs text-zinc-400">
                <input id="f-phone" type="text" readonly aria-label="Your mobile number"
                       class="w-full bg-zinc-900 border border-zinc-700 p-2 text-xs text-zinc-400">
                <select id="vehicle-select" aria-label="Your vehicle"
                        class="w-full bg-zinc-900 border border-zinc-700 p-2 text-xs text-white"></select>

                <form id="vehicle-form" class="hidden space-y-3 border border-zinc-800 p-3" novalidate>
                    <p class="text-[10px] uppercase font-bold text-zinc-500">New vehicle</p>
                    <input id="v-make" type="text" maxlength="50" placeholder="Make (e.g. Toyota)" required
                           class="w-full bg-zinc-900 border border-zinc-700 p-2 text-xs">
                    <input id="v-model" type="text" maxlength="50" placeholder="Model (e.g. Fortuner)" required
                           class="w-full bg-zinc-900 border border-zinc-700 p-2 text-xs">
                    <select id="v-type" aria-label="Vehicle type"
                            class="w-full bg-zinc-900 border border-zinc-700 p-2 text-xs text-white">
                        <option>Sedan</option>
                        <option>SUV</option>
                        <option>Hatchback</option>
                        <option>Truck</option>
                        <option>Van</option>
                        <option>Other</option>
                    </select>
                    <input id="v-plate" type="text" maxlength="12" placeholder="Plate number (optional)"
                           class="w-full bg-zinc-900 border border-zinc-700 p-2 text-xs">
                    <div class="flex gap-2">
                        <button id="v-save" type="submit" class="flex-1 bg-altRed text-white font-bold py-2 text-xs uppercase">Save vehicle</button>
                        <button id="v-cancel" type="button" class="flex-1 border border-zinc-700 text-zinc-300 font-bold py-2 text-xs uppercase">Cancel</button>
                    </div>
                </form>
            </div>

            <h2 class="font-bold text-sm uppercase border-l-2 border-altRed pl-2 mb-4">Select Service</h2>
            <div id="service-list" role="radiogroup" aria-label="Service" class="space-y-3 text-xs">
                <p class="text-zinc-500">Loading services…</p>
            </div>

            <button id="continue-btn" type="button" disabled
                    class="w-full bg-altRed text-white font-bold py-3 mt-5 text-sm uppercase">Proceed to Schedule</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
            integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/book-service.js"></script>
</body>
</html>
